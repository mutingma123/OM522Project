[workspace]
name = "option6-flow-line"
version = "0.1.0"
description = "OM 522 option 6: one job sequence for an eight-stage production line"
authors = ["mutingma123 <mma10@ua.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
numba = ">=0.60"
matplotlib = ">=3.8"
pytest = ">=8"

[pypi-dependencies]
option6-flow-line = { path = ".", editable = true }

[tasks]
solve = "python -m pfsp solve"
check = "python -m pfsp_check"
compare = "python -m pfsp compare"
stress = "python -m pfsp stress"
reproduce = "python -m pfsp reproduce"
test = "pytest"
